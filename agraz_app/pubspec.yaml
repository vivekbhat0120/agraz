name: agraz
description: "A New Ray of Hope in Agriculture."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+25

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  fl_chart: ^1.1.0 
  cupertino_icons: ^1.0.8
  http: ^1.3.0
  connectivity_plus: ^6.1.4
  intl_phone_field: ^3.2.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  video_player: ^2.9.2
  chewie: ^1.8.5
  google_fonts: ^8.2.1
  speech_to_text: ^7.4.0
  excel: ^4.0.6
  pdf: ^3.11.1
  printing: ^5.13.4
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  in_app_update: ^4.2.3
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  path: ^1.9.1
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

# ADD THIS SECTION TO FIX THE DEPENDENCY CONFLICT
dependency_overrides:
  vector_math: ^2.2.0
  archive: ^3.6.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo_padded.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_logo_padded.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/app_logo.png
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: scaleAspectFit
  fullscreen: true
  android_12:
    color: "#FFFFFF"
    image: assets/images/app_logo_padded.png
    icon_background_color: "#FFFFFF"

