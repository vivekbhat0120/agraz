server {
    listen 80;
    listen [::]:80;
    server_name agrazllp.com www.agrazllp.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name agrazllp.com www.agrazllp.com;

    root /var/www/agrazllp.com/agraz_web;
    index index.html index.htm;

    ssl_certificate /etc/letsencrypt/live/agrazllp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agrazllp.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Tenant-ID $http_x_tenant_id;
        proxy_pass_request_headers on;
        client_max_body_size 128m;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React admin SPA (root + try_files works better than alias for SPA fallback)
    location /agraz_admin {
        root /var/www/agrazllp.com/agraz_web;
        try_files $uri $uri/ /agraz_admin/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
